name: Bootstrap USB System

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bootstrap-usb.yml'

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout USB repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Copy current web baseline
        run: |
          git clone --depth 1 https://github.com/GaryPalfreman/Process-and-Maintenance-Engineering-System-web.git /tmp/web-system
          rsync -a --delete \
            --exclude '.git' \
            --exclude '.github' \
            /tmp/web-system/ ./

      - name: Commit baseline snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "USB baseline already current."
            exit 0
          fi
          git commit -m "Import current engineering system web baseline"
          git push
