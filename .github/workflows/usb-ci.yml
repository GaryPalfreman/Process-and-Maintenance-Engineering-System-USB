name: USB Local CI

on:
  push:
    branches: [main]
    paths:
      - '*.py'
      - 'pages/*.py'
      - '*.sh'
      - '.github/workflows/usb-ci.yml'
  workflow_dispatch:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Python syntax check
        run: |
          python3 -m py_compile *.py pages/*.py
      - name: Linux launcher shell syntax check
        run: |
          sh -n "START ENGINEERING SYSTEM - LINUX.sh"
      - name: Linux installer preparation check
        run: |
          grep -q 'if system == "Linux":' install_local.py
          grep -q 'XDG_DATA_HOME' install_local.py
          grep -q 'START ENGINEERING SYSTEM - LINUX.sh' install_local.py
          echo "Linux installer preparation: PASS"
