name: USB Local CI

on:
  push:
    branches: [main]
    paths:
      - '*.py'
      - 'pages/*.py'
      - '.github/workflows/usb-ci.yml'
  workflow_dispatch:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Python syntax check
        run: |
          python3 -m py_compile *.py pages/*.py
